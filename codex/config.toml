# Codex CLI configuration.
#
# Symlinked to ~/.codex/config.toml by codex/install.sh on macOS; Linux hosts
# get config.linux.toml instead. Codex edits this file in place and preserves
# comments, so its own additions (project trust levels, model migration
# notices, TUI counters) land here and show up as repo diffs. Only the config
# is tracked -- the rest of ~/.codex is auth, session history and ~850MB of
# installed packages, none of which belong in git.

model = "gpt-6.1-sol"
model_reasoning_effort = "high"

# Sandbox. The confined profile is defined in codex/requirements.macos.toml,
# installed root-owned at /etc/codex/requirements.toml, so no codex session
# can widen it; that file also pins this selection and the approval policy
# however codex is launched. Without it codex refuses to start
# ("default_permissions requires a `[permissions]` table"): run
# codex/install.sh. Prompts that would run a command outside the sandbox, or
# widen the sandbox mid-session, are auto-rejected, so there is no escape
# hatch; command rules, MCP elicitations and skill scripts still prompt.
default_permissions = "confined"
approval_policy = { granular = { sandbox_approval = false, request_permissions = false, rules = true, mcp_elicitations = true, skill_approval = true } }

# AI_AGENT marks shells codex spawns as agent-driven, so hosts/*.sh skip slow
# cluster init; the codex() wrapper in aliases/aliases.symlink sets it too, this
# covers codex started elsewhere. ~/.gitconfig is a symlink inside the denied
# $HOME and git aborts on a global config it cannot access, so GIT_CONFIG_GLOBAL
# sends it to the dotfiles copy, whose include and excludes name dotfiles paths
# as well. The GIT_CONFIG_* pair (the env block of
# claude/managed-settings.macos.json) adds what the sandbox needs on top: clone
# over https and authenticate through gh, since ~/.ssh is unreadable.
[shell_environment_policy.set]
AI_AGENT = "codex"
GIT_CONFIG_GLOBAL = "/Users/michaes/.dotfiles/git/gitconfig.symlink"
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "url.https://github.com/.insteadOf"
GIT_CONFIG_VALUE_0 = "git@github.com:"
GIT_CONFIG_KEY_1 = "credential.https://github.com.helper"
GIT_CONFIG_VALUE_1 = "!gh auth git-credential"

# Trusted projects. Entries are per-machine; ones whose path does not exist on
# the current host are simply inert, so the union across machines is harmless.
[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"
"gpt-5.4" = "gpt-5.6-terra"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 2
gpt-6-astra = 4

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/michaes/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true
