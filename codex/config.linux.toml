# Codex CLI configuration for Linux hosts. codex/install.sh symlinks it to
# ~/.codex/config.toml everywhere but macOS, which uses config.toml and keeps
# the sandbox profile in the root-owned requirements file. Codex edits this
# file in place and preserves comments, so its own additions (project trust
# levels, model migration notices, TUI counters) land here as repo diffs.

model = "gpt-6.1-sol"
model_reasoning_effort = "high"

# Sandbox. Same boundary as claude/managed-settings.macos.json: commands write
# the workspace and the temp dirs, read everything outside $HOME, and inside
# $HOME only the tool and config directories listed in the profile below. The
# profile is a copy of the one in requirements.macos.toml; keep the two in
# step. There is no root-owned requirements layer without root, so nothing
# pins this selection against CLI overrides here. Prompts that would run a
# command outside the sandbox, or widen the sandbox mid-session, are
# auto-rejected; command rules, MCP elicitations and skill scripts still
# prompt.
default_permissions = "confined"
approval_policy = { granular = { sandbox_approval = false, request_permissions = false, rules = true, mcp_elicitations = true, skill_approval = true } }

# AI_AGENT marks shells codex spawns as agent-driven, so hosts/*.sh skip slow
# cluster init; the codex() wrapper in aliases/aliases.symlink sets it too, this
# covers codex started elsewhere. The GIT_CONFIG_* pair (the env block of
# claude/managed-settings.macos.json) gives a sandboxed git what it needs: clone
# over https and authenticate through gh, since ~/.ssh is unreadable.
# GIT_CONFIG_GLOBAL is not set here: ~/.gitconfig is a symlink inside the denied
# $HOME and git aborts on a global config it cannot access, but values are
# literal and the cluster home path is machine-specific. Until it names
# <home>/.dotfiles/git/gitconfig.symlink, git fails inside the sandbox.
[shell_environment_policy.set]
AI_AGENT = "codex"
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "url.https://github.com/.insteadOf"
GIT_CONFIG_VALUE_0 = "git@github.com:"
GIT_CONFIG_KEY_1 = "credential.https://github.com.helper"
GIT_CONFIG_VALUE_1 = "!gh auth git-credential"

[permissions.confined]
description = "Workspace writes; reads outside $HOME and in listed $HOME dirs; no escalation."
extends = ":workspace"

[permissions.confined.filesystem]
# Paths must be absolute, ~/-relative, or :-prefixed -- codex rejects bare globs.
# More specific entries override broader ones, so a read grant reopens part of
# the $HOME deny and a nested deny closes part of a read grant.
#
# Linux sandboxing (bubblewrap) cannot evaluate `**` live, so codex pre-expands
# deny globs at sandbox startup and needs a depth cap; macOS seatbelt matches
# live and ignores it. 4 covers ~/.secrets/* and a .secrets directory up to
# three levels below $HOME; anything deeper is not denied.
glob_scan_max_depth = 4
":root" = "read"
"~" = "deny"
"/Volumes" = "deny"
# Readable inside $HOME: the allowRead list of claude/managed-settings.macos.json,
# with Claude's own directories swapped for codex's. Symlinks in $HOME such as
# ~/.gitconfig or ~/.localrc cannot be reopened: codex canonicalizes read paths
# to their targets, so the link itself stays denied. git gets its config through
# GIT_CONFIG_GLOBAL in [shell_environment_policy.set] instead.
"~/.dotfiles/git" = "read"
"~/.dotfiles/bin" = "read"
"~/.config/git" = "read"
"~/.config/gh" = "read"
"~/Library/Keychains" = "read"
"~/.local" = "read"
"~/.local/share/opencode" = "deny"
"~/.bun" = "read"
"~/.cargo" = "read"
"~/.cargo/credentials" = "deny"
"~/.cargo/credentials.toml" = "deny"
"~/.rustup" = "read"
"~/.pixi" = "read"
"~/.cache" = "read"
"~/.cache/huggingface" = "deny"
"~/.npm" = "read"
"~/.codex/skills" = "read"
# .secrets anywhere under $HOME, including inside the directories above and
# inside a workspace that lives under $HOME. .env is deliberately NOT denied:
# job environment variables live there and the agents need to wire them into
# job scripts. Real credentials belong in ~/.secrets, which stays unreadable.
# Same call as claude/settings.json.
"~/**/.secrets" = "deny"
"~/**/.secrets.*" = "deny"
"~/**/.secrets/**" = "deny"

[permissions.confined.filesystem.":workspace_roots"]
# :workspace keeps .git read-only, which turns every git commit into an
# escalation request; with escalation off it would be impossible. Hooks and
# config stay read-only, as in bin/claude-write-guard: they run code outside
# the sandbox.
".git" = "write"
".git/hooks" = "read"
".git/config" = "read"
# Workspaces outside $HOME (cluster scratch, /Volumes) get the same .secrets rule.
"**/.secrets" = "deny"
"**/.secrets.*" = "deny"
"**/.secrets/**" = "deny"

[permissions.confined.network]
# Direct access, no domain proxy; claude allows every domain as well. With the
# network on, git push and package installs run inside the sandbox instead of
# asking to leave it.
enabled = true
