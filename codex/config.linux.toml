# Codex CLI configuration for Linux hosts. codex/install.sh symlinks it to
# ~/.codex/config.toml everywhere but macOS, which uses config.toml and keeps
# the sandbox profile in the root-owned requirements file. Codex edits this
# file in place and preserves comments, so its own additions (project trust
# levels, model migration notices, TUI counters) land here as repo diffs.

model = "gpt-6.1-sol"
model_reasoning_effort = "high"

# Sandbox. Commands write the workspace and the temp dirs and read everything
# except the credential paths denied in the profile below. This is a deny-list,
# weaker than the $HOME allow-list of requirements.macos.toml: codex's Linux
# backend (bubblewrap, checked on 0.170.0) never binds "read" grants under a
# denied "~" back in, so with "~" = "deny" $HOME is an empty read-only tmpfs,
# every deny mask inside it fails ("bwrap: Can't mkdir parents"), and codex
# cannot even re-exec its own helper from ~/.config/nvm. Revisit when that
# changes. There is no root-owned requirements layer without root, so nothing
# pins this selection against CLI overrides here. Prompts that would run a
# command outside the sandbox, or widen the sandbox mid-session, are
# auto-rejected; command rules, MCP elicitations and skill scripts still
# prompt.
default_permissions = "confined"
approval_policy = { granular = { sandbox_approval = false, request_permissions = false, rules = true, mcp_elicitations = true, skill_approval = true } }

# AI_AGENT marks shells codex spawns as agent-driven, so hosts/*.sh skip slow
# cluster init; the codex() wrapper in aliases/aliases.symlink sets it too, this
# covers codex started elsewhere. The GIT_CONFIG_* pair (the env block of
# claude/managed-settings.macos.json) gives a sandboxed git what it needs: clone
# over https and authenticate through gh, since ~/.ssh is unreadable.
[shell_environment_policy.set]
AI_AGENT = "codex"
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "url.https://github.com/.insteadOf"
GIT_CONFIG_VALUE_0 = "git@github.com:"
GIT_CONFIG_KEY_1 = "credential.https://github.com.helper"
GIT_CONFIG_VALUE_1 = "!gh auth git-credential"

[permissions.confined]
description = "Workspace writes; reads everywhere except credential paths; no escalation."
extends = ":workspace"

[permissions.confined.filesystem]
# Paths must be absolute, ~/-relative, or :-prefixed -- codex rejects bare globs.
#
# bubblewrap masks each deny with a mount, which has two limits: a symlinked
# path cannot be masked (on the clusters ~/.cache/huggingface links to scratch,
# so only its token files are listed, and those are skipped while absent), and
# `**` is pre-expanded at sandbox startup down to glob_scan_max_depth. 4 covers
# *secret* names up to four levels below $HOME; anything deeper is not denied. Paths that do not exist are skipped, so the list can name credentials
# a host does not have.
glob_scan_max_depth = 4
":root" = "read"
"/Volumes" = "deny"
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.aws" = "deny"
"~/.netrc" = "deny"
"~/.git-credentials" = "deny"
"~/.pypirc" = "deny"
"~/.docker/config.json" = "deny"
"~/.kube" = "deny"
"~/.config/gcloud" = "deny"
"~/.codex/auth.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.local/share/opencode" = "deny"
"~/.cargo/credentials" = "deny"
"~/.cargo/credentials.toml" = "deny"
"~/.cache/huggingface/token" = "deny"
"~/.cache/huggingface/stored_tokens" = "deny"
"~/.mozilla" = "deny"
"~/.bash_history" = "deny"
"~/.zsh_history" = "deny"
# Any file or directory with "secret" in its name under $HOME, ~/.secrets
# included. Globs are case-sensitive, `*` does not match a leading dot, and a
# glob-matched directory hides nothing below it without the `/**` form, hence
# twelve patterns. A symlink whose name matches
# breaks sandbox startup -- bwrap cannot mask it. .env is deliberately NOT
# denied: job environment variables live there and the agents need to wire
# them into job scripts. Real credentials belong in ~/.secrets, which stays
# unreadable.
"~/**/*secret*" = "deny"
"~/**/*Secret*" = "deny"
"~/**/*SECRET*" = "deny"
"~/**/.*secret*" = "deny"
"~/**/.*Secret*" = "deny"
"~/**/.*SECRET*" = "deny"
"~/**/secret*/**" = "deny"
"~/**/Secret*/**" = "deny"
"~/**/SECRET*/**" = "deny"
"~/**/.secret*/**" = "deny"
"~/**/.Secret*/**" = "deny"
"~/**/.SECRET*/**" = "deny"

[permissions.confined.filesystem.":workspace_roots"]
# :workspace keeps .git read-only, which turns every git commit into an
# escalation request; with escalation off it would be impossible. Hooks and
# config stay read-only, as in bin/claude-write-guard: they run code outside
# the sandbox.
".git" = "write"
".git/hooks" = "read"
".git/config" = "read"
# Workspaces outside $HOME (cluster scratch, /Volumes) get the same rule.
"**/*secret*" = "deny"
"**/*Secret*" = "deny"
"**/*SECRET*" = "deny"
"**/.*secret*" = "deny"
"**/.*Secret*" = "deny"
"**/.*SECRET*" = "deny"
"**/secret*/**" = "deny"
"**/Secret*/**" = "deny"
"**/SECRET*/**" = "deny"
"**/.secret*/**" = "deny"
"**/.Secret*/**" = "deny"
"**/.SECRET*/**" = "deny"

[permissions.confined.network]
# Direct access, no domain proxy; claude allows every domain as well. With the
# network on, git push and package installs run inside the sandbox instead of
# asking to leave it.
enabled = true

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 2

[projects."/users/mschneider/trialanderror"]
trust_level = "trusted"
